name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (defaults to latest commit SHA)'
        required: false
        type: string

jobs:
  test-build:
    uses: ./.github/workflows/ci.yml

  test-deployment:
    needs: test-build
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: [test-deployment]
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Get ECR URL
        id: ecr
        working-directory: terraform/environments/prod
        run: echo "url=$(terraform output -raw ecr_url)" >> $GITHUB_OUTPUT

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.ecr.outputs.url }}:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.ecr.outputs.url }}:latest .
          docker push ${{ steps.ecr.outputs.url }}:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.ecr.outputs.url }}:latest

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: |
          terraform apply -auto-approve \
            -var="ecr_repository_url=${{ steps.ecr.outputs.url }}" \
            -var="image_tag=${{ steps.tag.outputs.tag }}"

  smoke-test:
    needs: deploy
    uses: ./.github/workflows/test-deployment.yml
    with:
      function_name: calculate_lift_prod
    secrets: inherit
