name: test-deployment

on:
  workflow_call:
    inputs:
      function_name:
        description: Lambda function name to invoke
        type: string
        default: calculate_lift_dev
  workflow_dispatch:
    inputs:
      function_name:
        description: Lambda function name to invoke
        type: string
        default: calculate_lift_dev

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Invoke Lambda
        run: |
          aws lambda invoke --function-name ${{ inputs.function_name }} \
            --payload '{"scaling_factor": 1.5}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          jq -e '.lift | type == "number"' response.json
