name: deploy-dev

on:
  workflow_call:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]

jobs:

  deploy:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Get ECR URL
        id: ecr
        working-directory: terraform/environments/dev
        run: echo "url=$(terraform output -raw ecr_url)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.ecr.outputs.url }}:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.url }}:latest .
          docker push ${{ steps.ecr.outputs.url }}:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.url }}:latest

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply -auto-approve \
            -var="ecr_repository_url=${{ steps.ecr.outputs.url }}" \
            -var="image_tag=${{ github.sha }}"

  smoke-test:
    needs: deploy
    uses: ./.github/workflows/test-deployment.yml
    secrets: inherit
